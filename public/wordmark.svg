    letter-spacing="0.22em"
  >
    <tspan fill="#f5f3ef">GREA</tspan><tspan fill="#ff3d14">T</tspan><tspan fill="#f5f3ef">RI</tspan><tspan fill="#ff3d14">P</tspan><tspan fill="#f5f3ef">IN</tspan>
  </text>
</svg>
