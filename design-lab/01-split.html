<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>01 · TWO DOORS — Eatripin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap">
  <link rel="stylesheet" href="lab.css">
  <style>
    :root{
      --ink:#161410;--paper:#f3efe4;--citrus:#e6b800;--ocean:#1a4a5c;--dim:#6b6456;--line:#d9d0bc;
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Pretendard,sans-serif}
    body{min-height:100dvh}
    button,input{font:inherit}
    .word{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;letter-spacing:-.04em;font-size:22px}
    .word .t,.word .p{color:var(--ocean)}
    .word .i{position:relative}
    .word .i::after{content:"";position:absolute;width:6px;height:6px;border-radius:50%;background:var(--citrus);top:-2px;left:50%;transform:translateX(-50%)}
    header.app{
      display:flex;align-items:center;justify-content:space-between;
      padding:14px 18px;border-bottom:1px solid var(--line);
    }
    header.app nav{display:flex;gap:18px;font-size:14px}
    header.app a{color:var(--ink);text-decoration:none}
    header.app a:hover{color:var(--ocean)}

    .split{display:grid;min-height:calc(100dvh - 110px)}
    @media(min-width:860px){.split{grid-template-columns:1fr 1fr}}
    .door{position:relative;padding:28px 22px 80px;min-height:52dvh}
    .door.who{background:var(--ink);color:var(--paper)}
    .door.where{background:var(--paper)}
    .door h2{font-family:"Bricolage Grotesque",sans-serif;font-size:clamp(42px,7vw,76px);margin:0 0 8px;letter-spacing:-.05em;line-height:0.95}
    .door .hint{opacity:.7;margin:0 0 22px;font-size:14px}
    .ch{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid #ffffff1f;color:inherit;text-decoration:none;cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
    .door.where .ch{border-top-color:var(--line)}
    .av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;flex-shrink:0}
    .ch b{display:block;font-size:16px}
    .ch span{font-size:12px;opacity:.65}
    .city{display:grid;grid-template-columns:88px 1fr;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);text-decoration:none;color:inherit}
    .city img{width:88px;height:56px;object-fit:cover}
    .city b{font-size:18px}
    .city span{color:var(--dim);font-size:13px}

    .search-dock{
      position:sticky;bottom:0;padding:14px 18px 20px;
      background:linear-gradient(transparent, var(--paper) 28%);
    }
    .search{
      display:flex;align-items:center;gap:10px;
      background:#fff;border:1.5px solid var(--ink);padding:0 14px;height:54px;
      box-shadow:0 10px 30px -16px #16141088;
    }
    .search input{border:0;outline:0;flex:1;background:transparent;font-size:16px}
    .search kbd{font-size:11px;border:1px solid var(--line);padding:2px 6px;color:var(--dim)}
    .suggest{position:absolute;left:18px;right:18px;bottom:78px;background:#fff;border:1px solid var(--ink);display:none}
    .search-wrap{position:relative}
    .suggest button{display:block;width:100%;text-align:left;padding:12px 14px;background:none;border:0;border-bottom:1px solid var(--line);cursor:pointer}
    .suggest button:hover{background:var(--citrus)}

    .piece{display:grid;min-height:calc(100dvh - 56px)}
    @media(min-width:900px){.piece{grid-template-columns:320px 1fr}}
    .plist{background:#fff;border-right:1px solid var(--line);padding:18px}
    .crumb{font-size:12px;color:var(--dim);margin:0 0 6px}
    .plist h1{font-family:"Bricolage Grotesque",sans-serif;font-size:34px;margin:0 0 4px;letter-spacing:-.04em}
    .plist .meta{color:var(--dim);font-size:13px;margin-bottom:16px}
    .filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
    .filters button{border:1px solid var(--line);background:none;padding:6px 10px;font-size:12px;cursor:pointer}
    .filters button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
    .stop{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer}
    .stop .n{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;color:var(--ocean)}
    .stop small{color:var(--dim)}
    .stop .t{font-variant-numeric:tabular-nums;color:var(--dim);font-size:12px}
    .map{position:relative;min-height:52dvh;background:#dfe8ea url(assets/map.jpg) center/cover}
    .pin{position:absolute;transform:translate(-50%,-100%);border:0;background:none;cursor:pointer;padding:0}
    .pin i{display:block;width:22px;height:22px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--citrus);border:2px solid var(--ink)}
    .pin b{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:800;transform:rotate(45deg)}
    .pin:hover i,.pin:focus-visible i{background:var(--ocean);color:#fff}

    #sheet{position:fixed;inset:0;z-index:50}
    #sheet[hidden]{display:none}
    .sheet-scrim{position:absolute;inset:0;background:#16141055}
    .sheet-card{position:absolute;left:0;right:0;bottom:0;max-height:86dvh;overflow:auto;background:#fff;border-top:3px solid var(--citrus)}
    @media(min-width:800px){
      .sheet-card{left:auto;right:24px;bottom:24px;width:380px;max-height:80dvh;border:1px solid var(--ink);border-top:3px solid var(--citrus)}
    }
    .sheet-cut img{width:100%;height:160px;object-fit:cover;display:block}
    .sheet-body{padding:16px 18px 22px}
    .sheet-k{margin:0;font-size:12px;letter-spacing:.08em;color:var(--ocean);font-weight:700}
    .sheet-body h2{margin:4px 0 0;font-size:24px;letter-spacing:-.03em}
    .sheet-local{margin:2px 0 0;color:var(--dim);font-size:13px}
    .sheet-addr{margin:8px 0;font-size:13px;color:var(--dim)}
    .sheet-sum{margin:0 0 14px;line-height:1.55}
    .sheet-src{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:center;margin-bottom:14px}
    .sheet-src img{width:72px;height:40px;object-fit:cover}
    .sheet-src span{display:block;font-size:12px;color:var(--dim)}
    .sheet-cta{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .btn-yt{background:var(--ink);color:var(--paper);text-align:center;padding:12px;text-decoration:none;font-weight:700}
    .btn-map{background:var(--citrus);color:var(--ink);text-align:center;padding:12px;text-decoration:none;font-weight:700}
    .sheet-x{position:absolute;right:10px;top:10px;border:0;background:#fff;width:32px;height:32px;cursor:pointer}
  </style>
</head>
<body>
  <div class="labbar">
    <a href="index.html">← 시안</a>
    <span class="lab-name">01 TWO DOORS · 누구 / 어디</span>
    <nav>
      <a href="01-split.html" aria-current="page">1</a>
      <a href="02-map.html">2</a>
      <a href="03-gate.html">3</a>
      <a href="04-line.html">4</a>
      <a href="05-desk.html">5</a>
      <a href="06-chapters.html">6</a>
    </nav>
  </div>

  <header class="app">
    <a href="#" data-open="home" class="word" aria-label="Eatripin 홈">ea<span class="t">t</span>ri<span class="p">p</span><span class="i">i</span>n</a>
    <nav>
      <a href="#" data-open="home">입구</a>
      <a href="#" data-open="piece">곽튜브 · 도쿄</a>
    </nav>
  </header>

  <section data-page="home" class="home">
    <div class="split">
      <div class="door who">
        <h2>누구</h2>
        <p class="hint">따라갈 채널을 고르면 그 사람의 도시가 열립니다.</p>
        <button class="ch" data-open="piece"><i class="av" style="background:#c62828">곽</i><div><b>곽튜브</b><span>도쿄 · 오사카 · 후쿠오카 · 67곳</span></div></button>
        <button class="ch" data-open="piece"><i class="av" style="background:#00897b">빠</i><div><b>빠니보틀</b><span>파리 · 방콕 · 도쿄 · 48곳</span></div></button>
        <button class="ch" data-open="piece"><i class="av" style="background:#e6a817">원</i><div><b>원지의하루</b><span>타이베이 · 도쿄 · 37곳</span></div></button>
        <button class="ch" data-open="piece"><i class="av" style="background:#1565c0">츄</i><div><b>츄성훈</b><span>오사카 · 후쿠오카 · 31곳</span></div></button>
      </div>
      <div class="door where">
        <h2>어디</h2>
        <p class="hint">도시를 고르면 그곳을 간 채널들이 한 지도에 모입니다.</p>
        <a class="city" href="#" data-open="piece"><img src="assets/tokyo.jpg" alt=""><div><b>도쿄</b><span>86곳 · 채널 4</span></div></a>
        <a class="city" href="#" data-open="piece"><img src="assets/osaka.jpg" alt=""><div><b>오사카</b><span>54곳 · 채널 3</span></div></a>
        <a class="city" href="#" data-open="piece"><img src="assets/fukuoka.jpg" alt=""><div><b>후쿠오카</b><span>41곳 · 채널 2</span></div></a>
        <a class="city" href="#" data-open="piece"><img src="assets/bangkok.jpg" alt=""><div><b>방콕</b><span>33곳 · 채널 2</span></div></a>
      </div>
    </div>
    <div class="search-dock">
      <div class="search-wrap">
        <div class="suggest" id="sug">
          <button type="button" data-open="piece">곽튜브 · 도쿄 — 34곳 지도</button>
          <button type="button" data-open="piece">곽튜브 · 오사카</button>
        </div>
        <label class="search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
          <input id="q" placeholder="곽튜브 도쿄" autocomplete="off">
          <kbd>검색</kbd>
        </label>
      </div>
    </div>
  </section>

  <section data-page="piece" hidden>
    <div class="piece">
      <aside class="plist">
        <p class="crumb">채널 × 도시</p>
        <h1>곽튜브<br>도쿄</h1>
        <p class="meta">34곳 · 영상 3편 · 이 지도가 제품입니다</p>
        <div class="filters">
          <button class="on" type="button">전체</button>
          <button type="button">맛집</button>
          <button type="button">카페</button>
          <button type="button">명소</button>
        </div>
        <div id="stops"></div>
      </aside>
      <div class="map" id="map"></div>
    </div>
  </section>

  <div id="sheet" hidden></div>
  <script src="common.js"></script>
  <script>
    const q = document.getElementById("q");
    const sug = document.getElementById("sug");
    q.addEventListener("input", () => { sug.style.display = q.value.trim() ? "block" : "none"; });
    q.addEventListener("focus", () => { if (q.value.trim()) sug.style.display = "block"; });
    document.addEventListener("click", (e) => { if (!e.target.closest(".search-wrap")) sug.style.display = "none"; });

    const stops = document.getElementById("stops");
    const map = document.getElementById("map");
    EATRIPIN.places.forEach((p) => {
      stops.insertAdjacentHTML("beforeend", `
        <button class="stop" data-pin="${p.id}">
          <span class="n">${p.id}</span>
          <span><b>${p.name}</b><br><small>${p.type} · ${p.area}</small></span>
          <span class="t">${p.t}</span>
        </button>`);
      const b = document.createElement("button");
      b.className = "pin";
      b.dataset.pin = p.id;
      b.style.left = p.x + "%";
      b.style.top = p.y + "%";
      b.innerHTML = `<i><b>${p.id}</b></i>`;
      b.setAttribute("aria-label", p.name);
      map.appendChild(b);
    });
  </script>
</body>
</html>
