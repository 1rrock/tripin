<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>04 · LINE — Eatripin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo:wght@500;800&display=swap">
  <link rel="stylesheet" href="lab.css">
  <style>
    :root{--paper:#f6f4ee;--ink:#0e0e0e;--a:#c62828;--b:#00897b;--c:#e6a817;--d:#1565c0;--dim:#5c5a53}
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Pretendard,sans-serif}
    button{font:inherit}
    header.app{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:3px solid var(--ink)}
    .logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
    .word{font-family:Chivo,sans-serif;font-weight:800;letter-spacing:.14em;font-size:14px}
    .bull{width:22px;height:22px;border:4px solid var(--ink);border-radius:50%;position:relative}
    .bull::after{content:"";position:absolute;inset:4px;background:var(--a);border-radius:50%}
    h1{font-family:Chivo,sans-serif;font-size:clamp(28px,5vw,44px);margin:0;letter-spacing:-.03em}
    .wrap{padding:22px 20px 80px;max-width:980px;margin:0 auto}

    .legend{display:flex;flex-wrap:wrap;gap:10px 16px;margin:8px 0 28px;font-size:13px}
    .legend i{display:inline-block;width:22px;height:6px;vertical-align:middle;margin-right:6px}

    .diagram{background:#fff;border:3px solid var(--ink);padding:28px 18px;overflow:auto}
    .line{display:grid;grid-template-columns:140px 1fr;gap:12px;align-items:center;margin:0 0 26px}
    .line:last-child{margin:0}
    .lname{font-family:Chivo,sans-serif;font-weight:800;font-size:15px}
    .lname small{display:block;font-weight:500;color:var(--dim);font-size:12px;font-family:Pretendard,sans-serif}
    .track{position:relative;height:44px;display:flex;align-items:center}
    .track .rail{position:absolute;left:0;right:0;height:8px}
    .st{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;cursor:pointer;padding:0;min-width:72px}
    .st i{width:18px;height:18px;border-radius:50%;background:#fff;border:4px solid var(--ink)}
    .st b{font-size:12px;font-weight:800}
    .st:hover i{background:var(--ink)}

    .piece{display:grid}
    @media(min-width:900px){.piece{grid-template-columns:1fr 320px}}
    .map{position:relative;min-height:56dvh;background:#e7e4dc url(assets/map.jpg) center/cover}
    .pin{position:absolute;transform:translate(-50%,-50%);border:0;background:none;cursor:pointer;padding:0}
    .pin i{display:block;width:18px;height:18px;border-radius:50%;background:#fff;border:5px solid var(--a);box-shadow:0 2px 6px #0003}
    .side{border-top:3px solid var(--ink);padding:18px}
    @media(min-width:900px){.side{border-top:0;border-left:3px solid var(--ink)}}
    .side .k{font-size:12px;letter-spacing:.14em;font-weight:800}
    .side h2{font-family:Chivo,sans-serif;margin:6px 0;font-size:28px}
    .stop{display:grid;grid-template-columns:22px 1fr auto;gap:10px;width:100%;padding:10px 0;border:0;border-top:1px solid #ddd8cc;background:none;text-align:left;cursor:pointer}
    .dot{width:12px;height:12px;border-radius:50%;background:var(--a);margin-top:4px}

    #sheet{position:fixed;inset:0;z-index:40}
    #sheet[hidden]{display:none}
    .sheet-scrim{position:absolute;inset:0;background:#0e0e0e44}
    .sheet-card{position:absolute;left:0;right:0;bottom:0;background:#fff;max-height:88dvh;overflow:auto;border-top:3px solid var(--ink)}
    @media(min-width:800px){.sheet-card{left:auto;right:16px;width:380px;bottom:16px;border:3px solid var(--ink)}}
    .sheet-cut img{width:100%;height:150px;object-fit:cover;display:block}
    .sheet-body{padding:16px}
    .sheet-k{margin:0;color:var(--a);font-size:12px;font-weight:800;letter-spacing:.1em}
    .sheet-body h2{margin:4px 0 0;font-family:Chivo,sans-serif}
    .sheet-local,.sheet-addr{margin:2px 0;color:var(--dim);font-size:13px}
    .sheet-sum{line-height:1.55}
    .sheet-src{display:grid;grid-template-columns:72px 1fr;gap:10px;margin:12px 0}
    .sheet-src img{width:72px;height:40px;object-fit:cover}
    .sheet-src span{display:block;font-size:12px;color:var(--dim)}
    .sheet-cta{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .btn-yt{background:var(--a);color:#fff;text-align:center;padding:12px;text-decoration:none;font-weight:800}
    .btn-map{background:var(--ink);color:#fff;text-align:center;padding:12px;text-decoration:none;font-weight:800}
    .sheet-x{position:absolute;right:10px;top:10px;border:0;background:#fff;width:32px;height:32px;cursor:pointer}
  </style>
</head>
<body>
  <div class="labbar">
    <a href="index.html">← 시안</a>
    <span class="lab-name">04 LINE · 채널 = 노선</span>
    <nav>
      <a href="01-split.html">1</a>
      <a href="02-map.html">2</a>
      <a href="03-gate.html">3</a>
      <a href="04-line.html" aria-current="page">4</a>
      <a href="05-desk.html">5</a>
      <a href="06-chapters.html">6</a>
    </nav>
  </div>

  <header class="app">
    <a class="logo" href="#" data-open="home"><span class="bull"></span><span class="word">EATRIPIN</span></a>
    <span style="font-size:13px;color:var(--dim)">노선도 · 2026</span>
  </header>

  <section data-page="home" class="wrap">
    <h1>누구 라인을<br>탈까요?</h1>
    <div class="legend">
      <span><i style="background:var(--a)"></i>곽튜브</span>
      <span><i style="background:var(--b)"></i>빠니보틀</span>
      <span><i style="background:var(--c)"></i>원지의하루</span>
      <span><i style="background:var(--d)"></i>츄성훈</span>
    </div>
    <div class="diagram">
      <div class="line">
        <div class="lname" style="color:var(--a)">곽튜브 선<small>LINE KWAK · 67곳</small></div>
        <div class="track">
          <div class="rail" style="background:var(--a)"></div>
          <button class="st" data-open="piece"><i style="border-color:var(--a)"></i><b>도쿄</b></button>
          <button class="st" data-open="piece"><i style="border-color:var(--a)"></i><b>오사카</b></button>
          <button class="st" data-open="piece"><i style="border-color:var(--a)"></i><b>후쿠오카</b></button>
        </div>
      </div>
      <div class="line">
        <div class="lname" style="color:var(--b)">빠니보틀 선<small>LINE PPANI · 48곳</small></div>
        <div class="track">
          <div class="rail" style="background:var(--b)"></div>
          <button class="st" data-open="piece"><i style="border-color:var(--b)"></i><b>파리</b></button>
          <button class="st" data-open="piece"><i style="border-color:var(--b)"></i><b>방콕</b></button>
          <button class="st" data-open="piece"><i style="border-color:var(--b)"></i><b>도쿄</b></button>
        </div>
      </div>
      <div class="line">
        <div class="lname" style="color:var(--c)">원지의하루 선<small>LINE WONJI · 37곳</small></div>
        <div class="track">
          <div class="rail" style="background:var(--c)"></div>
          <button class="st" data-open="piece"><i style="border-color:var(--c)"></i><b>타이베이</b></button>
          <button class="st" data-open="piece"><i style="border-color:var(--c)"></i><b>도쿄</b></button>
        </div>
      </div>
      <div class="line">
        <div class="lname" style="color:var(--d)">츄성훈 선<small>LINE CHOO · 31곳</small></div>
        <div class="track">
          <div class="rail" style="background:var(--d)"></div>
          <button class="st" data-open="piece"><i style="border-color:var(--d)"></i><b>오사카</b></button>
          <button class="st" data-open="piece"><i style="border-color:var(--d)"></i><b>후쿠오카</b></button>
        </div>
      </div>
    </div>
  </section>

  <section data-page="piece" hidden>
    <div class="piece">
      <div class="map" id="map"></div>
      <aside class="side">
        <div class="k" style="color:var(--a)">KWAK LINE · NEXT STOP</div>
        <h2>도쿄</h2>
        <p style="color:var(--dim);margin:0 0 12px">이 정거장의 34곳. 핀 색은 탄 라인입니다.</p>
        <div id="stops"></div>
      </aside>
    </div>
  </section>
  <div id="sheet" hidden></div>
  <script src="common.js"></script>
  <script>
    const stops = document.getElementById("stops");
    const map = document.getElementById("map");
    EATRIPIN.places.forEach((p) => {
      stops.insertAdjacentHTML("beforeend", `
        <button class="stop" data-pin="${p.id}">
          <span class="dot"></span>
          <span><b>${p.name}</b><br><small style="color:var(--dim)">${p.type} · ${p.area}</small></span>
          <span>${p.t}</span>
        </button>`);
      const b = document.createElement("button");
      b.className = "pin";
      b.dataset.pin = p.id;
      b.style.left = p.x + "%";
      b.style.top = p.y + "%";
      b.innerHTML = "<i></i>";
      b.setAttribute("aria-label", p.name);
      map.appendChild(b);
    });
  </script>
</body>
</html>
