<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>02 · THE MAP — Eatripin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@500;700;800&display=swap">
  <link rel="stylesheet" href="lab.css">
  <style>
    :root{--parch:#e8e0cc;--ink:#1b2430;--pin:#e23b2a;--water:#9bb8bc;--sheet:#f7f2e6;--dim:#5c6670}
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;background:var(--parch);color:var(--ink);font-family:Pretendard,sans-serif}
    body{overflow:hidden}
    button{font:inherit}
    .stage{position:relative;height:calc(100dvh - 42px)}
    .map{
      position:absolute;inset:0;
      background:#c9d5d4 url(assets/map.jpg) center/cover;
      filter:saturate(.85) contrast(1.05);
    }
    .hud{position:absolute;inset:0;pointer-events:none}
    .hud > *{pointer-events:auto}
    .top{display:flex;align-items:center;gap:10px;padding:12px 14px}
    .logo{display:flex;align-items:center;gap:8px;background:var(--sheet);padding:6px 10px 6px 6px;border:1px solid var(--ink);text-decoration:none;color:inherit}
    .logo svg{display:block}
    .word{font-family:"Albert Sans",sans-serif;font-weight:800;letter-spacing:.08em;font-size:12px}
    .find{flex:1;display:flex;align-items:center;gap:8px;height:42px;padding:0 12px;background:var(--sheet);border:1px solid var(--ink)}
    .find input{border:0;outline:0;background:transparent;flex:1;font-size:15px}
    .chips{display:flex;gap:6px;padding:0 14px;overflow:auto}
    .chips button{flex:0 0 auto;border:1px solid var(--ink);background:var(--sheet);padding:7px 12px;border-radius:999px;cursor:pointer;font-size:13px}
    .chips button.on{background:var(--ink);color:var(--sheet)}
    .chips .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}

    .pin{position:absolute;transform:translate(-50%,-100%);border:0;background:none;cursor:pointer;padding:0}
    .pin .head{width:26px;height:26px;background:var(--pin);color:#fff;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:grid;place-items:center;box-shadow:0 4px 10px -4px #1b243088}
    .pin .head span{transform:rotate(45deg);font-size:11px;font-weight:800;font-family:"Albert Sans",sans-serif}
    .pin.on .head{background:var(--ink);width:30px;height:30px}

    .peek{position:absolute;left:0;right:0;bottom:0;background:var(--sheet);border-top:1px solid var(--ink);padding:10px 16px 18px;box-shadow:0 -12px 40px -20px #1b243066}
    .grab{width:36px;height:4px;background:#c9c0aa;margin:0 auto 10px;border-radius:99px}
    .peek h1{margin:0;font-family:"Albert Sans",sans-serif;font-size:22px;letter-spacing:-.03em}
    .peek .sub{color:var(--dim);font-size:13px;margin:2px 0 10px}
    .peek-row{display:flex;gap:8px;overflow:auto}
    .peek-row button{flex:0 0 148px;border:1px solid #d3cbb6;background:#fff;padding:0;text-align:left;cursor:pointer}
    .peek-row img{width:100%;height:78px;object-fit:cover;display:block}
    .peek-row b{display:block;padding:6px 8px 2px;font-size:13px}
    .peek-row span{display:block;padding:0 8px 8px;font-size:11px;color:var(--dim)}

    #sheet{position:fixed;inset:0;z-index:40}
    #sheet[hidden]{display:none}
    .sheet-scrim{position:absolute;inset:0;background:#1b243055}
    .sheet-card{position:absolute;left:0;right:0;bottom:0;background:var(--sheet);max-height:88dvh;overflow:auto;border-top:1px solid var(--ink)}
    @media(min-width:820px){.sheet-card{left:16px;width:400px;bottom:16px;border:1px solid var(--ink)}}
    .sheet-cut img{width:100%;height:150px;object-fit:cover;display:block}
    .sheet-body{padding:16px}
    .sheet-k{margin:0;color:var(--pin);font-size:12px;font-weight:800;letter-spacing:.06em}
    .sheet-body h2{margin:4px 0 0;font-family:"Albert Sans",sans-serif;font-size:26px}
    .sheet-local,.sheet-addr{margin:2px 0;color:var(--dim);font-size:13px}
    .sheet-sum{line-height:1.55}
    .sheet-src{display:grid;grid-template-columns:72px 1fr;gap:10px;margin:12px 0}
    .sheet-src img{width:72px;height:40px;object-fit:cover}
    .sheet-src span{display:block;font-size:12px;color:var(--dim)}
    .sheet-cta{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .btn-yt{background:var(--pin);color:#fff;text-align:center;padding:12px;text-decoration:none;font-weight:800}
    .btn-map{background:var(--ink);color:var(--sheet);text-align:center;padding:12px;text-decoration:none;font-weight:800}
    .sheet-x{position:absolute;right:10px;top:10px;border:0;background:#fff;width:32px;height:32px;cursor:pointer}
  </style>
</head>
<body>
  <div class="labbar">
    <a href="index.html">← 시안</a>
    <span class="lab-name">02 THE MAP · 지도가 홈</span>
    <nav>
      <a href="01-split.html">1</a>
      <a href="02-map.html" aria-current="page">2</a>
      <a href="03-gate.html">3</a>
      <a href="04-line.html">4</a>
      <a href="05-desk.html">5</a>
      <a href="06-chapters.html">6</a>
    </nav>
  </div>

  <div class="stage">
    <div class="map" id="map"></div>
    <div class="hud">
      <div class="top">
        <a class="logo" href="index.html" aria-label="Eatripin">
          <svg width="26" height="26" viewBox="0 0 32 32">
            <path d="M16 3 L20 13 H29 L22 19 L25 29 L16 23 L7 29 L10 19 L3 13 H12 Z" fill="#e23b2a"/>
            <path d="M13 12 L20 16 L13 20 Z" fill="#f7f2e6"/>
          </svg>
          <span class="word">EATRIPIN</span>
        </a>
        <label class="find">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
          <input value="곽튜브 도쿄" aria-label="검색">
        </label>
      </div>
      <div class="chips" id="chips">
        <button class="on" type="button"><i class="dot" style="background:#c62828"></i>곽튜브</button>
        <button type="button"><i class="dot" style="background:#00897b"></i>빠니보틀</button>
        <button type="button"><i class="dot" style="background:#e6a817"></i>원지의하루</button>
        <button type="button"><i class="dot" style="background:#1565c0"></i>츄성훈</button>
      </div>
      <div class="peek">
        <div class="grab"></div>
        <h1>곽튜브 · 도쿄</h1>
        <p class="sub">34곳이 이 지도에 꽂혀 있습니다. 핀을 누르면 그 장면으로 갑니다.</p>
        <div class="peek-row" id="peek"></div>
      </div>
    </div>
  </div>
  <div id="sheet" hidden></div>
  <script src="common.js"></script>
  <script>
    const map = document.getElementById("map");
    const peek = document.getElementById("peek");
    EATRIPIN.places.forEach((p) => {
      const b = document.createElement("button");
      b.className = "pin";
      b.dataset.pin = p.id;
      b.style.left = p.x + "%";
      b.style.top = p.y + "%";
      b.innerHTML = `<span class="head"><span>${p.id}</span></span>`;
      b.setAttribute("aria-label", p.name);
      map.appendChild(b);
      peek.insertAdjacentHTML("beforeend", `
        <button type="button" data-pin="${p.id}">
          <img src="assets/${p.img}" alt="">
          <b>${p.name}</b>
          <span>${p.type} · ${p.t}</span>
        </button>`);
    });
    document.getElementById("chips").addEventListener("click", (e) => {
      const b = e.target.closest("button");
      if (!b) return;
      document.querySelectorAll(".chips button").forEach((x) => x.classList.toggle("on", x === b));
    });
  </script>
</body>
</html>
