<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" role="img" aria-label="EATRIPIN">
  <title>EATRIPIN — tracking fold only (dark)</title>
  <desc>Shared T·P implied only by tighter tracking around folds</desc>
  <rect width="800" height="160" fill="#0b0b0c"/>
  <g
    font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-weight="700"
    font-size="68"
    fill="#f5f3ef"
  >
    <text y="100">
      <tspan x="48" letter-spacing="0.28em">EA</tspan>
      <tspan x="200" letter-spacing="0.06em">T</tspan>
      <tspan x="268" letter-spacing="0.28em">RI</tspan>
      <tspan x="420" letter-spacing="0.06em">P</tspan>
      <tspan x="488" letter-spacing="0.28em">IN</tspan>
    </text>
  </g>
</svg>
