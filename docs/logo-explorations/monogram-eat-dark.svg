<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="EAT">
  <title>EATRIPIN monogram EAT (dark)</title>
  <desc>E + A + T. Same stroke language as ET monogram; T-stem wax (shared fold).</desc>
  <rect width="512" height="512" fill="#0b0b0c"/>
  <rect x="36" y="36" width="440" height="440" fill="none" stroke="#2c2c31" stroke-width="2"/>

  <!-- Same weight/caps as ET monogram; layout compressed to fit A in the middle -->
  <g fill="none" stroke="#f5f3ef" stroke-width="36" stroke-linecap="square" stroke-linejoin="miter">
    <!-- E -->
    <path d="M 92 160 V 352"/>
    <path d="M 92 160 H 188"/>
    <path d="M 92 256 H 172"/>
    <path d="M 92 352 H 188"/>
    <!-- A -->
    <path d="M 210 352 L 268 160 L 326 352"/>
    <path d="M 234 286 H 302"/>
    <!-- T bar -->
    <path d="M 348 160 H 452"/>
  </g>
  <!-- T stem = shared fold, wax -->
  <path d="M 400 160 V 352" fill="none" stroke="#ff3d14" stroke-width="36" stroke-linecap="square"/>
</svg>
