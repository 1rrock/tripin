<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 180" role="img" aria-label="EATRIPIN">
  <title>EATRIPIN — boxed shared letters (dark)</title>
  <desc>Shared T and P framed by thin hairline boxes instead of color</desc>
  <rect width="820" height="180" fill="#0b0b0c"/>
  <!-- E A T R I P I N — boxes on T (index 3) and P (index 6) -->
  <g
    font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-weight="700"
    font-size="68"
    letter-spacing="0.22em"
    fill="#f5f3ef"
  >
    <text y="108">
      <tspan x="48">E</tspan>
      <tspan x="132">A</tspan>
      <tspan x="216">T</tspan>
      <tspan x="300">R</tspan>
      <tspan x="384">I</tspan>
      <tspan x="468">P</tspan>
      <tspan x="552">I</tspan>
      <tspan x="636">N</tspan>
    </text>
  </g>
  <rect x="204" y="48" width="72" height="84" fill="none" stroke="#2c2c31" stroke-width="1.25"/>
  <rect x="456" y="48" width="72" height="84" fill="none" stroke="#2c2c31" stroke-width="1.25"/>
</svg>
