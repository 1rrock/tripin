<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Eatripin">
  <title>Eatripin app icon — blue seal ET solid monogram</title>
  <rect width="512" height="512" fill="#0A3D91"/>

  <circle cx="256" cy="256" r="196" fill="none" stroke="#FFFFFF" stroke-width="6"/>
  <circle cx="256" cy="256" r="168" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>

  <g stroke="#FFFFFF" stroke-width="3.5" fill="none">
    <line x1="92" y1="236" x2="124" y2="236"/>
    <line x1="92" y1="250" x2="124" y2="250"/>
    <line x1="92" y1="264" x2="124" y2="264"/>
    <line x1="388" y1="236" x2="420" y2="236"/>
    <line x1="388" y1="250" x2="420" y2="250"/>
    <line x1="388" y1="264" x2="420" y2="264"/>
  </g>

  <defs>
    <path id="arcTopS" d="M 130,256 A 126,126 0 0,1 382,256" fill="none"/>
    <path id="arcBotS" d="M 382,256 A 126,126 0 0,1 130,256" fill="none"/>
  </defs>
  <text fill="#FFFFFF" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="28" letter-spacing="0.32em">
    <textPath href="#arcTopS" startOffset="50%" text-anchor="middle">EATRIPIN</textPath>
  </text>
  <text fill="#FFFFFF" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600" font-size="18" letter-spacing="0.28em">
    <textPath href="#arcBotS" startOffset="50%" text-anchor="middle">DIRECTORY</textPath>
  </text>

  <!-- solid geometric ET — closer to PB filled monogram weight -->
  <g fill="#FFFFFF">
    <!-- E: vertical bar -->
    <rect x="178" y="198" width="26" height="116"/>
    <!-- E top -->
    <rect x="178" y="198" width="72" height="26"/>
    <!-- E mid -->
    <rect x="178" y="243" width="56" height="26"/>
    <!-- E bottom -->
    <rect x="178" y="288" width="72" height="26"/>
    <!-- T top bar -->
    <rect x="238" y="198" width="96" height="26"/>
    <!-- T stem -->
    <rect x="273" y="198" width="26" height="116"/>
  </g>
</svg>
