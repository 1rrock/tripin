<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="EAT">
  <title>EAT · seal on warm paper (theme colors, not blue)</title>
  <rect width="512" height="512" fill="#f0e8db"/>

  <circle cx="256" cy="256" r="196" fill="none" stroke="#2a2118" stroke-width="6"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="#2a2118" stroke-width="2"/>

  <g stroke="#2a2118" stroke-width="3.5" fill="none">
    <line x1="96" y1="238" x2="128" y2="238"/>
    <line x1="96" y1="252" x2="128" y2="252"/>
    <line x1="96" y1="266" x2="128" y2="266"/>
    <line x1="384" y1="238" x2="416" y2="238"/>
    <line x1="384" y1="252" x2="416" y2="252"/>
    <line x1="384" y1="266" x2="416" y2="266"/>
  </g>

  <defs>
    <path id="arcTopEat" d="M 128,256 A 128,128 0 0,1 384,256" fill="none"/>
    <path id="arcBotEat" d="M 384,256 A 128,128 0 0,1 128,256" fill="none"/>
  </defs>
  <text fill="#2a2118" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="24" letter-spacing="0.34em">
    <textPath href="#arcTopEat" startOffset="50%" text-anchor="middle">EATRIPIN</textPath>
  </text>
  <text fill="#6e5c4a" font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="600" font-size="16" letter-spacing="0.26em">
    <textPath href="#arcBotEat" startOffset="50%" text-anchor="middle">EAT · TRIP · PIN</textPath>
  </text>

  <!-- compact EAT monogram in center -->
  <g fill="none" stroke="#2a2118" stroke-width="18" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M 168 220 V 300"/>
    <path d="M 168 220 H 208"/>
    <path d="M 168 260 H 200"/>
    <path d="M 168 300 H 208"/>
    <path d="M 228 300 L 256 220 L 284 300"/>
    <path d="M 240 274 H 272"/>
    <path d="M 304 220 H 352"/>
  </g>
  <path d="M 328 220 V 300" fill="none" stroke="#c9441a" stroke-width="18" stroke-linecap="square"/>
</svg>
