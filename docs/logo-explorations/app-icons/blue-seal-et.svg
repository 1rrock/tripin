<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Eatripin">
  <title>Eatripin app icon — blue seal ET</title>
  <!-- Paris Baguette–like seal: saturated royal blue field, white monogram ring -->
  <rect width="512" height="512" fill="#0A3D91"/>

  <!-- outer ring -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="#FFFFFF" stroke-width="6"/>
  <!-- inner ring -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>

  <!-- side double ticks (left) -->
  <g stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="butt" fill="none">
    <line x1="92" y1="236" x2="124" y2="236"/>
    <line x1="92" y1="250" x2="124" y2="250"/>
    <line x1="92" y1="264" x2="124" y2="264"/>
  </g>
  <!-- side double ticks (right) -->
  <g stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="butt" fill="none">
    <line x1="388" y1="236" x2="420" y2="236"/>
    <line x1="388" y1="250" x2="420" y2="250"/>
    <line x1="388" y1="264" x2="420" y2="264"/>
  </g>

  <!-- top arc: EATRIPIN -->
  <defs>
    <path id="arcTop" d="M 130,256 A 126,126 0 0,1 382,256" fill="none"/>
    <path id="arcBot" d="M 382,256 A 126,126 0 0,1 130,256" fill="none"/>
  </defs>
  <text
    fill="#FFFFFF"
    font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-weight="700"
    font-size="28"
    letter-spacing="0.32em"
  >
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">EATRIPIN</textPath>
  </text>
  <text
    fill="#FFFFFF"
    font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-weight="600"
    font-size="18"
    letter-spacing="0.28em"
  >
    <textPath href="#arcBot" startOffset="50%" text-anchor="middle">EAT · TRIP · PIN</textPath>
  </text>

  <!-- ET monogram — geometric interlocking, PB-style weight -->
  <g fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="square" stroke-linejoin="miter">
    <!-- E spine + bars -->
    <path d="M 188 200 V 312"/>
    <path d="M 188 200 H 248"/>
    <path d="M 188 256 H 236"/>
    <path d="M 188 312 H 248"/>
    <!-- T bar + stem (stem shared fold) -->
    <path d="M 248 200 H 324"/>
    <path d="M 296 200 V 312"/>
  </g>
</svg>
