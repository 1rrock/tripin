<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="EAT">
  <title>EAT overlap · tighter nest — A almost inside ET skeleton</title>
  <rect width="512" height="512" fill="#f0e8db"/>
  <rect x="36" y="36" width="440" height="440" fill="none" stroke="#ddd0bc" stroke-width="2"/>

  <!--
    Even denser: A peak sits on E/T top bar line; legs tuck between E spine and T stem.
    Width still 140–380 = original ET span.
  -->
  <g fill="none" stroke="#2a2118" stroke-width="38" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M 140 160 V 352"/>
    <path d="M 140 160 H 280"/>
    <path d="M 140 256 H 248"/>
    <path d="M 140 352 H 280"/>
  </g>
  <g fill="none" stroke="#6e5c4a" stroke-width="38" stroke-linecap="square" stroke-linejoin="miter">
    <!-- A compressed: peak under shared top line, legs hug center -->
    <path d="M 200 352 L 255 168 L 310 352"/>
    <path d="M 226 290 H 284"/>
  </g>
  <g fill="none" stroke="#c9441a" stroke-width="38" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M 248 160 H 380"/>
    <path d="M 318 160 V 352"/>
  </g>
</svg>
