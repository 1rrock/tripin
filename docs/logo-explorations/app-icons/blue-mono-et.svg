<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Eatripin">
  <title>Eatripin app icon — blue field ET only</title>
  <!-- App-icon simplified: no arc text (reads at 60px). Same blue seal family. -->
  <rect width="512" height="512" fill="#0A3D91"/>

  <!-- soft ring for badge feel without tiny type -->
  <circle cx="256" cy="256" r="188" fill="none" stroke="#FFFFFF" stroke-width="8" opacity="0.95"/>
  <circle cx="256" cy="256" r="168" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.55"/>

  <!-- side ticks -->
  <g stroke="#FFFFFF" stroke-width="4" fill="none" opacity="0.9">
    <line x1="108" y1="232" x2="148" y2="232"/>
    <line x1="108" y1="252" x2="148" y2="252"/>
    <line x1="108" y1="272" x2="148" y2="272"/>
    <line x1="364" y1="232" x2="404" y2="232"/>
    <line x1="364" y1="252" x2="404" y2="252"/>
    <line x1="364" y1="272" x2="404" y2="272"/>
  </g>

  <!-- large ET monogram -->
  <g fill="none" stroke="#FFFFFF" stroke-width="36" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M 150 168 V 344"/>
    <path d="M 150 168 H 250"/>
    <path d="M 150 256 H 230"/>
    <path d="M 150 344 H 250"/>
    <path d="M 250 168 H 362"/>
    <path d="M 318 168 V 344"/>
  </g>
</svg>
