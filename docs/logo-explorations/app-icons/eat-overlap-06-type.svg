<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="EAT">
  <title>EAT overlap · type stacked on one center with tracking collapse</title>
  <rect width="512" height="512" fill="#f0e8db"/>
  <rect x="36" y="36" width="440" height="440" fill="none" stroke="#ddd0bc" stroke-width="2"/>

  <!--
    Three full-size letters, same center, heavy negative letter-spacing via absolute positions.
    Width of the block ≈ one bold letter + a little, not three side-by-side.
  -->
  <g
    font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-weight="800"
    font-size="280"
    text-anchor="middle"
  >
    <!-- E left-of-center, still inside square -->
    <text x="210" y="340" fill="#2a2118">E</text>
    <!-- A dead center, on top of E/T -->
    <text x="256" y="340" fill="#6e5c4a">A</text>
    <!-- T right-of-center -->
    <text x="302" y="340" fill="#c9441a">T</text>
  </g>
</svg>
