<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="EAT">
  <title>EAT TYPE TIGHT · geometric canon · E ink / A dim / T wax</title>
  <rect width="512" height="512" fill="#f0e8db"/>
  <!-- A (back) -->
  <g fill="#6e5c4a" opacity="0.65">
    <polygon points="168,360 208,360 268,160 228,160"/>
    <polygon points="244,160 284,160 344,360 304,360"/>
    <rect x="210" y="268" width="92" height="36"/>
  </g>
  <!-- E (ink, left edge readable) -->
  <g fill="#2a2118">
    <rect x="148" y="150" width="44" height="220"/>
    <rect x="148" y="150" width="118" height="40"/>
    <rect x="148" y="240" width="96" height="36"/>
    <rect x="148" y="330" width="118" height="40"/>
  </g>
  <!-- T (wax, shared fold) -->
  <g fill="#c9441a">
    <rect x="236" y="150" width="148" height="40"/>
    <rect x="292" y="150" width="40" height="220"/>
  </g>
</svg>
