<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="ET">
  <title>EATRIPIN monogram ET (dark)</title>
  <desc>Square E + T. T-stem is wax (shared fold). Not a pin icon.</desc>
  <rect width="512" height="512" fill="#0b0b0c"/>
  <rect x="36" y="36" width="440" height="440" fill="none" stroke="#2c2c31" stroke-width="2"/>

  <g fill="none" stroke="#f5f3ef" stroke-width="40" stroke-linecap="square" stroke-linejoin="miter">
    <!-- E left -->
    <path d="M 140 160 V 352"/>
    <!-- E top -->
    <path d="M 140 160 H 280"/>
    <!-- E mid -->
    <path d="M 140 256 H 250"/>
    <!-- E bottom -->
    <path d="M 140 352 H 280"/>
  </g>

  <!-- T top bar (paper) -->
  <path d="M 260 160 H 380" fill="none" stroke="#f5f3ef" stroke-width="40" stroke-linecap="square"/>
  <!-- T stem = shared fold, wax -->
  <path d="M 328 160 V 352" fill="none" stroke="#ff3d14" stroke-width="40" stroke-linecap="square"/>
</svg>
