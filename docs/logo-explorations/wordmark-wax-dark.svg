<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 160" role="img" aria-label="EATRIPIN">
  <title>EATRIPIN — wax accent (dark)</title>
  <desc>eat+trip+pin with shared T and P in vermilion wax pencil</desc>
  <rect width="780" height="160" fill="#0b0b0c"/>
  <!-- EA · T · RI · P · IN  — T and P are the shared fold letters -->
  <text
    x="390" y="96"
    text-anchor="middle"
    font-family="Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-weight="700"
    font-size="72"
    letter-spacing="0.22em"
  >
    <tspan fill="#f5f3ef">EA</tspan><tspan fill="#ff3d14">T</tspan><tspan fill="#f5f3ef">RI</tspan><tspan fill="#ff3d14">P</tspan><tspan fill="#f5f3ef">IN</tspan>
  </text>
</svg>
