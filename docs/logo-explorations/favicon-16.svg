<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" role="img" aria-label="GT">
  <title>GREATRIPIN favicon 16</title>
  <rect width="16" height="16" fill="#0b0b0c"/>
  <!-- G: C + chin + spur (not E) -->
  <rect x="2" y="3" width="6" height="2" fill="#f5f3ef"/>
  <rect x="2" y="3" width="2" height="10" fill="#f5f3ef"/>
  <rect x="2" y="11" width="6" height="2" fill="#f5f3ef"/>
  <rect x="6" y="8" width="2" height="5" fill="#f5f3ef"/>
  <rect x="4" y="7" width="4" height="2" fill="#f5f3ef"/>
  <!-- T bar -->
  <rect x="7" y="3" width="7" height="2" fill="#f5f3ef"/>
  <!-- shared stem wax -->
  <rect x="10" y="3" width="2" height="10" fill="#ff3d14"/>
</svg>
